<!DOCTYPE html>
<html >

<head>
    
    <style>
        table {
            border-collapse: collapse;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        .yellow {
            background-color: #f5f5dc;
        }
        .blue {
            background-color: #e0f0ff;
        }
        .green {
            background-color: #e0ffe0;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th rowspan="3">Day</th>
        <th colspan="3">Seminar</th>
    </tr>
    <tr>
        <th colspan="2">Schedule</th>
        <th rowspan="2">Topic</th>
    </tr>
    <tr>
        <th>Begin</th>
        <th>End</th>
    </tr>
    <tr>
        <td rowspan="2">Monday</td>
        <td class="yellow" rowspan="2">8:00 a.m.</td>
        <td class="blue" rowspan="2">5:00 p.m.</td>
        <td>Introduction to XML</td>
    </tr>
    <tr>
        
        <td>Introduction to XML </td>
       
        
    </tr>
    <tr>
        <td rowspan="3">Tuesday</td>
        <td class="yellow">8:00 a.m.</td>
        <td class="blue">11:00 a.m.</td>
        <td rowspan="2">XPath</td>
    </tr>
    <tr>
        <td class="yellow">11:00 a.m.</td>
        <td class="green">2:00 p.m.</td>
    </tr>
    <tr>
        <td class="green">2:00 p.m.</td>
        <td class="blue">5:00 p.m.</td>
        <td>XSL Transformations</td>
    </tr>
    <tr>
        <td>Wednesday</td>
        <td class="yellow">8:00 a.m.</td>
        <td class="blue">12:00 p.m.</td>
        <td>XSL Formatting Objects</td>
    </tr>
</table>

</body>
</html>
